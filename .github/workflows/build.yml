name: Build Application

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' # Triggers on v1.0, v2.0-beta, etc.
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
        - uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11' # python-version: '3.13.9'
            cache: 'pip'

        - name: Install Dependencies
          run: |
            pip install -r requirements.txt
            pip install pyinstaller

        # --- WINDOWS BUILD STEP ---
        - name: Build with PyInstaller (Windows)
          if: runner.os == 'Windows'
          run: |
            pyinstaller --noconfirm --onedir --windowed --name "T1MESCULPTURES" --icon="assets/app/icon.ico" --add-data "assets/app/icon.ico;assets/app" --collect-all sv_ttk --collect-all pyvista --hidden-import="PIL" --hidden-import="cv2" algorithm/code/app/app.py
            
            # Zip immediately on Windows
            cd dist
            powershell Compress-Archive -Path "T1MESCULPTURES" -DestinationPath "../T1MESCULPTURES-Windows.zip"

        # --- MAC BUILD STEP ---
        - name: Build with PyInstaller (macOS)
          if: runner.os == 'macOS'
          run: |
            # 1. Build the App
            pyinstaller --noconfirm --onedir --windowed --name "T1MESCULPTURES" --icon="assets/app/icon.icns" --add-data "assets/app/icon.icns:assets/app" --collect-all sv_ttk --collect-all pyvista --hidden-import="PIL" --hidden-import="cv2" algorithm/code/app/app.py
            
            # 2. Force Executable Permissions
            # This ensures the inner binary is definitely marked as a program
            chmod +x dist/T1MESCULPTURES.app/Contents/MacOS/T1MESCULPTURES

            # 3. Ad-hoc Code Signing
            # The '-' means "sign with no identity" (ad-hoc), which is enough to fix "Damaged App" errors
            codesign --force --deep --sign - dist/T1MESCULPTURES.app

            # 4. COMPRESS HER
            # We tar it while it's still on the Mac, capturing the permissions
            cd dist
            tar -czf ../T1MESCULPTURES-macOS.tar.gz T1MESCULPTURES.app
            
        # --- UPLOAD ARTIFACTS (UPDATED TO V4) ---
        - name: Upload Build Artifact (Windows)
          if: runner.os == 'Windows'
          uses: actions/upload-artifact@v4
          with:
            name: T1MESCULPTURES-Windows
            path: T1MESCULPTURES-Windows.zip

        - name: Upload Build Artifact (Mac)
          if: runner.os == 'macOS'
          uses: actions/upload-artifact@v4
          with:
            name: T1MESCULPTURES-macOS
            path: T1MESCULPTURES-macOS.tar.gz
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') # Only run this if a tag was pushed!
    
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: T1MESCULPTURES-Windows

      - name: Download Mac Artifact
        uses: actions/download-artifact@v4
        with:
          name: T1MESCULPTURES-macOS

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            T1MESCULPTURES-Windows.zip
            T1MESCULPTURES-macOS.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true