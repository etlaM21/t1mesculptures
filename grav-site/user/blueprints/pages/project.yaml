title: Project
form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        content:
          type: tab
          title: Content
          fields:
            title:
              type: text
              label: Title
            header.number:
              type: text
              label: Project Number
            header.show_on_home:
              type: toggle
              label: Show on Homepage Grid?
              help: If No, the project is still accessible via link/QR, but hidden from the main list.
              highlight: 1
              default: 1
              options:
                1: 'Yes'
                0: 'No'
              validate:
                type: bool
            header.date:
              type: date
              label: Date
            header.duration:
              type: text
              label: Duration
            header.framesper:
              type: text
              label: Frames Per X
            
            # The Showcase Image
            header.project_image:
              type: file
              label: Showcase Image (JPG/PNG)
              destination: 'self@'
              multiple: false
              accept: ['image/*']

            # The THUMBNAIL Image
            header.thumb_image:
              type: file
              label: Thumb Image (JPG/PNG)
              destination: 'self@'
              multiple: false
              accept: ['image/*']

            # The Video
            header.hover_video:
              type: file
              label: Animation Video (WebM or GIF)
              destination: 'self@'
              multiple: false
              accept: ['video/*', 'image/gif']

            header.project_gallery:
              type: file
              label: Gallery Images
              destination: 'self@'
              multiple: true           # Allows multiple uploads
              accept:
                - image/*

            content:
              type: markdown
              label: Description

            qr_section:
              type: section
              title: QR Code for direct link via permanent redirect
              underline: true
            
            qr_preview:
              type: display
              label: QR Code (Right Click to Save)
              markdown: true
              content: |
                <div id="qr-target" style="text-align: center; padding: 20px; border: 1px solid #eee; background: white;">
                    Loading...
                </div>
                
                <script>
                (function() {
                    function generateQR() {
                        // 1. Get the slug from the current Admin URL
                        // URL format: .../pages/sculptures/ts001-giving-losing
                        var urlParts = window.location.href.split('/');
                        var slug = urlParts[urlParts.length - 1];

                        // If we are on the "Add Page" screen, we can't generate a QR yet
                        if (slug === 'add' || !slug) {
                             document.getElementById('qr-target').innerHTML = "<em>Please save the page first to generate the QR Code.</em>";
                             return;
                        }

                        // 2. Define your domain
                        var myDomain = window.location.origin; 
                        
                        // 3. Build the Redirect URL: /scan/ts001-giving-losing
                        var finalUrl = myDomain + "/scan/" + slug;
                        
                        // 4. Build the API URL for the image
                        var apiUrl = "https://api.qrserver.com/v1/create-qr-code/?size=1024x1024&format=svg&data=" + encodeURIComponent(finalUrl);
                        
                        // 5. Render the HTML
                        var html = '<a href="' + apiUrl + '" download="qrcode.png" target="_blank">';
                        html += '<img src="' + apiUrl + '" style="width: 200px; height: 200px;" alt="QR Code"></a>';
                        html += '<br><div style="margin-top:10px; font-family:monospace; background:#f4f4f4; padding:5px;">' + finalUrl + '</div>';
                        
                        document.getElementById('qr-target').innerHTML = html;
                    }

                    // Run slightly after load to ensure page is ready
                    setTimeout(generateQR, 500);
                    })();
                  </script>